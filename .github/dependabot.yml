version: 2
updates:
  - package-ecosystem: npm
    # typescript-eslint supports TypeScript < 6.1, so hold TypeScript majors until it catches up.
    ignore:
      - dependency-name: typescript
        update-types: ["version-update:semver-major"]
    directory: /web
    cooldown:
      default-days: 3
      semver-major-days: 7
    schedule:
      interval: weekly
    groups:
      web-dev-tooling:
        dependency-type: development
    open-pull-requests-limit: 5

  - package-ecosystem: uv
    directory: /pipeline
    cooldown:
      default-days: 3
      semver-major-days: 7
    schedule:
      interval: weekly
    open-pull-requests-limit: 5

  - package-ecosystem: github-actions
    directory: /
    cooldown:
      default-days: 3
      semver-major-days: 7
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ['*']
