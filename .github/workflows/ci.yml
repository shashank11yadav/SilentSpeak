name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pipeline:
    name: Pipeline (Python)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    defaults:
      run:
        working-directory: pipeline
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          working-directory: pipeline
          enable-cache: true
      - run: uv sync --locked
      - name: Lint
        run: uv run ruff check . && uv run ruff format --check .
      - name: Typecheck
        run: uv run mypy
      - name: Test (includes MediaPipe on a synthetic GRID zip)
        run: uv run pytest
      - name: Smoke run (synthetic corpus through prepare, train, evaluate, export)
        run: uv run silentspeak smoke
      - name: Audit dependencies
        run: uv run pip-audit --skip-editable

  web:
    name: Web (TypeScript)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - name: Lint
        run: npm run format:check && npm run lint
      - name: Typecheck
        run: npm run typecheck
      - name: Unit tests (including the shared feature-parity fixture)
        run: npm test
      - name: Build (fetches the face landmarker with a pinned SHA-256)
        run: npm run build
      - name: End-to-end tests
        run: npx playwright install --with-deps chromium && npm run test:e2e
      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high
