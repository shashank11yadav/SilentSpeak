[project]
name = "silentspeak"
version = "0.1.0"
description = "Training pipeline for SilentSpeak: GRID face landmarks, a lip-motion word encoder, held-out-speaker evaluation and ONNX export."
requires-python = ">=3.12,<3.13"
license = "MIT"
authors = [{ name = "Shashank Yadav" }]
dependencies = [
    "mediapipe==1.1.1",
    "numpy>=2.4",
    "onnx>=1.23.2",
    "onnxruntime>=1.31.0",
    "onnxscript>=0.7.2",
    "pillow>=13.0.0",
    "torch>=2.14.1",
    "tqdm>=4.70.1",
    "typer>=0.27.3",
]

[project.scripts]
silentspeak = "silentspeak.cli:main"

[dependency-groups]
dev = [
    "mypy>=2.4.0",
    "pip-audit>=2.10.1",
    "pytest>=9.1.1",
    "ruff>=0.17.1",
    "types-tqdm>=4.67",
]

[build-system]
requires = ["uv_build>=0.9.28,<0.14"]
build-backend = "uv_build"

# CPU-only torch on Linux keeps CI installs small; macOS wheels are CPU/MPS already.
[tool.uv.sources]
torch = [{ index = "pytorch-cpu", marker = "sys_platform == 'linux'" }]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF", "N", "S", "PT", "C4", "PTH", "NPY"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101"]

[tool.mypy]
strict = true
python_version = "3.12"
files = ["src", "tests"]

[[tool.mypy.overrides]]
module = ["mediapipe.*", "cv2.*", "onnxruntime.*", "onnx.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
markers = [
    "mediapipe: runs the MediaPipe face landmarker (downloads its pinned model on first use)",
    "grid: needs the real GRID download in the data directory",
]
